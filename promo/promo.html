<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lunch Board promo</title>
<style>
@font-face{font-family:Geist;src:url('../public/fonts/Geist-Variable.woff2') format('woff2');font-weight:100 900}
:root{--ink:#171717;--body:#4d4d4d;--mute:#6b6b6b;--line:#ebebeb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#fff;overflow:hidden;font-family:Geist,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff}
.abs{position:absolute}
.h{font-weight:600;letter-spacing:-0.05em;line-height:.96;font-size:116px;white-space:nowrap}
.ln{display:block;overflow:hidden;padding:0 0 .12em;margin-bottom:-.12em}
.w{display:inline-block;will-change:transform}
#line{left:210px;top:290px;width:1600px;height:860px;transform-origin:0 0;transform:scale(.9375)}
#line img{position:absolute}
#badge{position:absolute;left:1507px;top:262px;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:44px;display:grid;place-items:center;letter-spacing:-.03em}
#badgeTxt{position:absolute;left:1507px;top:318px;transform:translateX(-50%);font-size:24px;font-weight:500;color:var(--ink);white-space:nowrap}
#win{left:210px;top:350px;width:1500px;height:937px;border-radius:22px 22px 0 0;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.04),0 24px 60px -12px rgba(0,0,0,.18),0 60px 120px -30px rgba(0,0,0,.14)}
#win img{position:absolute;inset:0;width:100%;height:100%;will-change:transform,opacity}
.cap{left:210px;top:96px}
.cap .h{font-size:92px}
.chip{position:absolute;right:210px;top:112px;height:64px;padding:0 28px;border-radius:999px;background:var(--ink);color:#fff;font-size:28px;font-weight:500;display:flex;align-items:center;gap:14px}
.chip i{font-style:normal;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:700}
#end .sub{font-size:34px;line-height:1.35;color:var(--body);letter-spacing:-.01em;max-width:760px}
#brand{display:flex;align-items:center;gap:20px;font-size:38px;font-weight:600;letter-spacing:-.03em}
#brand svg{width:56px;height:62px}
</style></head><body>
<div id="stage">

  <!-- scenes A+B -->
  <div id="head" class="abs" style="left:210px;top:84px">
    <div id="hA" class="h abs" style="left:0;top:0"></div>
    <div id="hB" class="h abs" style="left:0;top:0"></div>
  </div>
  <div id="sceneA" class="abs" style="inset:0">
    <div id="line" class="abs">
      <img id="lineImg" src="../public/illustrations/lunch-line.png" style="left:0;top:0;width:1600px;height:860px">
      <div id="bubbles"></div>
      <div id="badge">0</div>
      <div id="badgeTxt">one order</div>
    </div>
  </div>

  <!-- scene C -->
  <div id="sceneC" class="abs" style="inset:0">
    <div id="caps"></div>
    <div id="chip" class="chip"><i>&#10003;</i><span id="chipTxt"></span></div>
    <div id="win" class="abs">
      <img id="sPick" src="shots/pick.png">
      <img id="sHome" src="shots/home.png">
      <img id="sOrder" src="shots/order.png">
    </div>
  </div>

  <!-- scene D -->
  <div id="end" class="abs" style="inset:0">
    <div id="brand" class="abs" style="left:210px;top:110px">
      <svg viewBox="0 0 36 40"><g fill="#171717"><rect x="1.5" y="1.5" width="27" height="5" rx="2.5"/><ellipse cx="15" cy="4" rx="4.2" ry="3.4"/><path d="M2.5 6h3.4v29.5l2 2.3V39H4l-1.5-2z"/><path d="M27.5 6h-3.4v29.5l-2 2.3V39H26l1.5-2z"/><path d="M10.4 14.2c0-4.4 9.2-4.4 9.2 0z"/><ellipse cx="15" cy="10.3" rx="2.4" ry="1"/><ellipse cx="15" cy="14.6" rx="8.6" ry="1.6"/><path d="M7.3 15.4h15.4c.9 6.2.9 14.6-.4 19.6-1.4 3.6-13.2 3.6-14.6 0-1.3-5-1.3-13.4-.4-19.6z"/></g><g fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round"><path d="M7.6 21.2q7.4 1.2 14.8 0M7.4 27q7.6 1.2 15.2 0M7.8 32.8q7.2 1.2 14.4 0"/></g><rect x="29.4" y="12.2" width="5.4" height="7.6" rx="0.8" fill="#fff" stroke="#171717" stroke-width="1"/></svg>
      <span>Lunch Board</span>
    </div>
    <div id="hE" class="h abs" style="left:210px;top:320px;font-size:128px"></div>
    <div id="sub" class="sub abs" style="left:210px;top:640px">Pick from any restaurant. The host places one Swiggy order. Everyone watches the board.</div>
    <img id="tiffin" src="../public/illustrations/tiffin.png" class="abs" style="left:1180px;top:130px;width:552px;height:841px">
  </div>
</div>

<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const outCubic=x=>1-Math.pow(1-x,3);
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const inOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const outBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);

// ---- headline builder: lines of words that rise out of a mask
function build(el,lines){
  el.innerHTML=''; const words=[];
  lines.forEach(l=>{const ln=document.createElement('span');ln.className='ln';
    l.split(' ').forEach((w,i,a)=>{const s=document.createElement('span');s.className='w';s.textContent=w+(i<a.length-1?' ':'');ln.appendChild(s);words.push(s)});
    el.appendChild(ln)});
  return words;
}
const wA=build($('hA'),['Everyone has a','different craving.']);
const wB=build($('hB'),['One order for','every craving.']);
const wE=build($('hE'),['Everyone picks.','One tiffin arrives.']);
// reveal words: in from a..a+d, out from o on
function words(ws,t,tin,tout,gap=.07){
  ws.forEach((w,i)=>{
    const a=seg(t,tin+i*gap,tin+i*gap+.7), b=tout==null?0:seg(t,tout+i*.04,tout+i*.04+.45);
    const y=(1-outExpo(a))*110 - outCubic(b)*110;
    w.style.transform=`translateY(${y}%)`;
  });
}

// ---- bubbles
const XS=[100,280,460,640,820,1000,1180,1360], TIERS=[1,0,1,0,1,0,1,0];
const KINDS=['biryani','burrito','salad','burger','dosa','ramen','icecream','chicken'];
const bub=[];
KINDS.forEach((k,i)=>{
  const im=document.createElement('img'); im.src=`../public/illustrations/thoughts/${k}.png`;
  im.style.cssText='position:absolute;width:200px;height:150px;will-change:transform,opacity';
  $('bubbles').appendChild(im);
  const x0=XS[i]-40+100, y0=(TIERS[i]?0:60)+75;
  bub.push({im,x0,y0});
});
const TX=1507, TY=395; // the tiffin in scene space
const FLY0=3.35, FLYSTEP=.11, FLYDUR=.8;
function arrival(i){return FLY0+i*FLYSTEP+FLYDUR}

// ---- captions for scene C
const caps=[
 {t0:5.2,t1:6.2,lines:['Everyone picks','their own.'],chip:'Any restaurant',img:'sPick'},
 {t0:6.2,t1:7.2,lines:['Watch the board','fill up live.'],chip:'26 of 35 picked',img:'sHome'},
 {t0:7.2,t1:8.3,lines:['One cart.','One Swiggy order.'],chip:'4 restaurants, ₹5,956',img:'sOrder'},
];
caps.forEach((c,i)=>{const d=document.createElement('div');d.className='cap abs';const h=document.createElement('div');h.className='h';d.appendChild(h);$('caps').appendChild(d);c.el=d;c.w=build(h,c.lines);});

function render(t){
  // ===== A + B
  words(wA,t,.25,3.2);
  words(wB,t,3.55,4.95);
  // line wipe in, scene out
  const wipe=outCubic(seg(t,.55,2.1));
  $('lineImg').style.clipPath=`inset(0 ${(1-wipe)*100}% 0 0)`;
  const sceneOut=inOut(seg(t,5.0,5.55));
  $('sceneA').style.opacity=1-sceneOut;
  $('sceneA').style.transform=`translateY(${sceneOut*80}px)`;
  $('sceneA').style.display=t>5.6?'none':'block';
  $('head').style.display=t>5.1?'none':'block';
  // bubbles
  let count=0;
  bub.forEach((b,i)=>{
    const pop=seg(t,1.3+i*.13,1.3+i*.13+.8);
    const bob=Math.sin(t*2.2+i*1.1)*4*(t<FLY0?1:0);
    let sc=outBack(pop), op=clamp(pop*3), x=b.x0, y=b.y0+bob;
    const f=seg(t,FLY0+i*FLYSTEP,FLY0+i*FLYSTEP+FLYDUR);
    if(f>0){
      const e=inOut(f);
      const cx=(b.x0+TX)/2, cy=Math.min(b.y0,TY)-170;
      x=(1-e)*(1-e)*b.x0+2*(1-e)*e*cx+e*e*TX;
      y=(1-e)*(1-e)*b.y0+2*(1-e)*e*cy+e*e*TY;
      sc=sc*(1-.78*e); op=op*(1-seg(f,.82,1));
      if(f>=1) count++;
    }
    b.im.style.opacity=op;
    b.im.style.transform=`translate(${x-100}px,${y-75}px) scale(${Math.max(sc,0)})`;
  });
  // badge counter
  const bs=t>FLY0?1:0;
  const lastHit=count>0?arrival(count-1):0;
  const bump=count>0?Math.exp(-(t-lastHit)*9)*Math.sin((t-lastHit)*0+1.57)*.28:0;
  const badgeIn=outBack(seg(t,FLY0+.2,FLY0+.7));
  $('badge').textContent=count;
  $('badge').style.transform=`scale(${Math.max(badgeIn,0)*(1+bump)})`;
  $('badgeTxt').textContent=count>=8?'one order':'';
  $('badgeTxt').style.opacity=seg(t,arrival(7),arrival(7)+.3);

  // ===== C
  const cIn=outExpo(seg(t,5.0,5.8)), cOut=inOut(seg(t,8.3,8.75));
  $('sceneC').style.display=(t<5.0||t>8.8)?'none':'block';
  $('win').style.transform=`translateY(${(1-cIn)*260+cOut*220}px)`;
  $('win').style.opacity=(t<5.1?0:1)*(1-cOut);
  const zoom={ // per-screen zoom: [origin x%, y%, scale from, scale to]
    sPick:[50,0,1.0,1.03], sHome:[50,0,1.0,1.03], sOrder:[50,0,1.0,1.03]};
  caps.forEach(c=>{
    const a=seg(t,c.t0,c.t0+.35), o=seg(t,c.t1-.3,c.t1);
    const show=a*(1-(c===caps[2]?cOut:o));
    // captions
    c.el.style.display=(t>=c.t0-.01&&t<=c.t1+.6)?'block':'none';
    words(c.w,t,c.t0+.02,c===caps[2]?8.3:c.t1-.34,.06);
    // screens
    const im=$(c.img), z=zoom[c.img];
    const p=seg(t,c.t0-.3,c.t1+.3);
    const s=z[2]+(z[3]-z[2])*outCubic(p);
    const idx=caps.indexOf(c);
    const enter=idx===0?1:outExpo(seg(t,c.t0-.05,c.t0+.55));
    im.style.transformOrigin='50% 0%';
    im.style.transform=`translateY(${(1-enter)*102}%) scale(${s})`;
    im.style.opacity=(idx>0&&t<c.t0-.06)?0:1;
    im.style.zIndex=idx+1;
  });
  // chip follows active caption
  const act=caps.findIndex(c=>t>=c.t0-.01&&t<c.t1)<0?(t>=7.9?2:0):caps.findIndex(c=>t>=c.t0-.01&&t<c.t1);
  const ac=caps[act];
  $('chipTxt').textContent=ac.chip;
  const chipA=outCubic(seg(t,5.5,5.9))*(1-cOut);
  const sw=Math.abs(Math.sin(Math.PI*clamp((t-ac.t0)/0.3,0,1)))*0; 
  $('chip').style.opacity=chipA; $('chip').style.transform=`translateY(${(1-chipA)*16}px)`;

  // ===== D
  const dOn=t>=8.7;
  $('end').style.display=dOn?'block':'none';
  const b=outExpo(seg(t,8.75,9.2));
  $('brand').style.opacity=b; $('brand').style.transform=`translateY(${(1-b)*14}px)`;
  words(wE,t,8.85,null,.08);
  const s2=outCubic(seg(t,9.2,9.6));
  $('sub').style.opacity=s2; $('sub').style.transform=`translateY(${(1-s2)*18}px)`;
  const tf=outCubic(seg(t,8.8,9.45));
  $('tiffin').style.clipPath=`inset(${(1-tf)*100}% 0 0 0)`;
  $('tiffin').style.transform=`translateY(${(1-tf)*40}px)`;
}
window.render=render;
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode?i.decode().catch(()=>{}):0)]);
render(0);
</script></body></html>
